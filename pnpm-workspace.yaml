packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@vaultui/tokens@0.1.2'
  - '@vaultui/utils@0.1.2'
  - '@astrojs/markdown-satteri@0.4.9'
  - '@astrojs/runtime@0.1.1'
  - '@astrojs/vite-plugin-astro@0.1.2'
  - astro@7.4.11

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - sharp
  - unrs-resolver
